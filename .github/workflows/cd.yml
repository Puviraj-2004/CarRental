# ================================================================
#  CD — Deploy on push to main
# ================================================================
#  Customize the deploy steps for your hosting provider:
#  - Docker registry push (GHCR, ECR, Docker Hub)
#  - VPS deploy via SSH
#  - Cloud Run / ECS / Kubernetes deploy
# ================================================================
name: CD

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend image ──────────────────────────────────────
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./Car_Rental_Backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend image ─────────────────────────────────────
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Car_Rental_Frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy (customize for your infrastructure) ─────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Deploy placeholder
        run: |
          echo "==========================================="
          echo "  Deploy step — customize for your setup"
          echo "==========================================="
          echo ""
          echo "Options:"
          echo "  1. SSH into VPS and docker compose pull + up"
          echo "  2. aws ecs update-service"
          echo "  3. gcloud run deploy"
          echo "  4. kubectl set image"
          echo ""
          echo "Images pushed:"
          echo "  Backend:  ${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          echo "  Frontend: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"
