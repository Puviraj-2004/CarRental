# ================================================================
#  Car Rental — Docker Compose (Development)
# ================================================================
#  Usage:
#    cp Car_Rental_Backend/.env.example  Car_Rental_Backend/.env
#    cp Car_Rental_Frontend/.env.example Car_Rental_Frontend/.env.local
#    docker compose up -d
# ================================================================
#
#  Migration strategy:
#    Migrations are run once by the backend container's entrypoint
#    script (docker-entrypoint.sh) before the Node process starts.
#    The separate `migrate` service has been removed — it caused
#    duplicate migration execution and race conditions when both
#    the migrate service and the backend entrypoint ran concurrently.
# ================================================================

services:
  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: car_rental
      POSTGRES_PASSWORD: car_rental_pass
      POSTGRES_DB: car_rental_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U car_rental -d car_rental_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (GraphQL API) ─────────────────────────────────
  # Migrations run inside docker-entrypoint.sh before the app starts.
  # postgres must be healthy before this container starts so the
  # migration step has a live database to connect to.
  backend:
    build:
      context: ./Car_Rental_Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./Car_Rental_Backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://car_rental:car_rental_pass@postgres:5432/car_rental_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # ── Frontend (Next.js) ────────────────────────────────────
  frontend:
    build:
      context: ./Car_Rental_Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/graphql
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./Car_Rental_Frontend/.env.local
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: http://localhost:3000
      INTERNAL_API_URL: http://backend:4000/graphql
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata: