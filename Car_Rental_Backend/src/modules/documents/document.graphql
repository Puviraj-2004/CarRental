enum VerificationStatus {
  PENDING
  APPROVED
  REJECTED
}

type Documents {
  id:              ID!
  licenseFrontUrl: String
  licenseBackUrl:  String
  idCardFrontUrl:  String
  idCardBackUrl:   String
  addressProofUrl: String
  licenseNumber:   String
  licenseExpiry:   DateTime
  age:             Int
  idNumber:        String
  idExpiry:        DateTime
  address:         String
  status:          VerificationStatus!
  createdAt:       DateTime!
  updatedAt:       DateTime!
}

type OCRPayload {
  licenseNumber: String
  licenseExpiry: String
  idNumber:      String
  idExpiry:      String
  address:       String
  birthDate:     String
}

input DocumentsInput {
  licenseFrontUrl: String!
  licenseBackUrl:  String!
  idCardFrontUrl:  String!
  idCardBackUrl:   String!
  addressProofUrl: String!
  
  licenseNumber:   String
  licenseExpiry:   String
  idNumber:        String
  idExpiry:        String
  address:         String
  birthDate:       String
}

type DocumentReuseStatus {
  hasApprovedDocuments: Boolean!
  documents:            Documents
}

extend type Query {
  # Fetches the Documents snapshot linked to a specific booking [1]
  bookingDocuments(bookingId: ID!): Documents

  # Verifies if the customer has an approved profile document ready for reuse [1]
  hasApprovedDocuments: DocumentReuseStatus!
}

extend type Mutation {
  # Step 1: Uploads files & returns OCR values for review [1]
  processDocumentOCR(
    licenseFrontUrl: String!,
    licenseBackUrl:  String!,
    idCardFrontUrl:  String!,
    idCardBackUrl:   String!,
    addressProofUrl: String!
  ): OCRPayload!

  # Step 2: Saves values and dynamically links to Profile if checked [1]
  saveBookingDocuments(bookingId: ID!, input: DocumentsInput!, saveToProfile: Boolean!): Documents!

  # Alternative Step: Links existing verified Profile Documents to the Booking (Zero Duplication!) [1]
  reuseDocumentsForBooking(bookingId: ID!): Documents!
}