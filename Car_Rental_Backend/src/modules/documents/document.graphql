enum VerificationStatus {
  PENDING
  APPROVED
  REJECTED
}

type Documents {
  id:              ID!
  userId:          ID    # <-- Added: Supports client queries safely
  bookingId:       ID    # <-- Added: Supports client queries safely
  licenseFrontUrl: String
  licenseBackUrl:  String
  idCardFrontUrl:  String
  idCardBackUrl:   String
  addressProofUrl: String
  licenseNumber:   String
  licenseExpiry:   DateTime
  age:             Int
  idNumber:        String
  idExpiry:        DateTime
  address:         String
  status:          VerificationStatus!
  createdAt:       DateTime!
  updatedAt:       DateTime!
}

type OCRPayload {
  licenseNumber: String
  licenseExpiry: String
  idNumber:      String
  idExpiry:      String
  address:       String
  birthDate:     String
}

input DocumentsInput {
  licenseFrontUrl: String!
  licenseBackUrl:  String!
  idCardFrontUrl:  String!
  idCardBackUrl:   String!
  addressProofUrl: String!
  
  licenseNumber:   String
  licenseExpiry:   String
  idNumber:        String
  idExpiry:        String
  address:         String
  birthDate:       String
}

type DocumentReuseStatus {
  hasApprovedDocuments: Boolean!
  documents:            Documents
}

extend type Query {
  bookingDocuments(bookingId: ID!): Documents
  hasApprovedDocuments: DocumentReuseStatus!
}

extend type Mutation {
  processDocumentOCR(
    licenseFrontUrl: String!,
    licenseBackUrl:  String!,
    idCardFrontUrl:  String!,
    idCardBackUrl:   String!,
    addressProofUrl: String!
  ): OCRPayload!

  saveBookingDocuments(bookingId: ID!, input: DocumentsInput!, saveToProfile: Boolean!): Documents!

  reuseDocumentsForBooking(bookingId: ID!): Documents!

  # Maps exactly to client-side admin verify mutation
  adminVerifyDocuments(userId: ID!, status: VerificationStatus!): Documents!
  adminVerifyBookingDocuments(bookingId: ID!, status: VerificationStatus!): Documents!
}
