enum CarStatus {
  AVAILABLE
  RESERVED
  RENTED
  UNAVAILABLE
}

type Brand {
  id:   ID!
  name: String!
}

type VehicleModel {
  id:    ID!
  name:  String!
  brand: Brand!
}

type FuelType {
  id:   ID!
  name: String!
}

type CarImage {
  id:       ID!
  carId:    String!
  url:      String!
  publicId: String!
}

type Car {
  id:                   ID!
  plateNumber:          String!
  basePrice:            Float!
  status:               CarStatus!
  primaryImageUrl:      String!
  primaryImagePublicId: String # <-- Updated: Made nullable (removed !) to prevent errors if no cover exists [1]
  model:                VehicleModel!
  fuelType:             FuelType
  images:               [CarImage!]!
}

input ImageInput {
  url: String!
  publicId: String!
}

type PaginatedCars {
  items:    [Car!]!
  pageInfo: PageInfo!
}

type CalendarDay {
  date:      String!
  available: Boolean!
  bookingId: String
}

input AddCarInput {
  modelId:      ID!
  plateNumber:  String!
  fuelTypeId:   ID
  basePrice:    Float!
  status:       CarStatus
  primaryImage: ImageInput # <-- Corrected: Removed duplicate "Upload" definition [1]
}

input UpdateCarInput {
  plateNumber:  String
  fuelTypeId:   ID
  basePrice:    Float
  primaryImage: ImageInput # <-- Corrected: Removed duplicate "Upload" definition [1]
}

input CarFilterInput {
  status:     CarStatus
  brandId:    ID
  modelId:    ID
  fuelTypeId: ID
  minPrice:   Float
  maxPrice:   Float
  search:     String
}

type CloudinarySignature {
  signature: String!
  timestamp: Int!
  apiKey: String!
  cloudName: String!
  folder: String!
}

extend type Query {
  car(id: ID!): Car
  cars(pagination: PaginationInput, filter: CarFilterInput): PaginatedCars!
  availableCars(startDate: String!, endDate: String!, pagination: PaginationInput): PaginatedCars!
  carsByStatus(status: CarStatus!, pagination: PaginationInput): PaginatedCars!
  carAvailabilityCalendar(carId: ID!, month: Int!, year: Int!): [CalendarDay!]!
  
  brands: [Brand!]!
  models: [VehicleModel!]!
  fuelTypes: [FuelType!]!

  cloudinarySignature(folder: String!): CloudinarySignature!
}

extend type Mutation {
  addCar(input: AddCarInput!): Car!
  updateCar(id: ID!, input: UpdateCarInput!): Car!
  deleteCar(id: ID!): Boolean!
  uploadCarImages(carId: ID!, images: [ImageInput!]!, setPrimary: Boolean): Car! 
  deleteCarImage(imageId: ID!): Boolean!
  setPrimaryImage(carId: ID!, imageId: ID!): Car!
  updateCarStatus(id: ID!, status: CarStatus!): Car!
  updateCarPricing(id: ID!, basePrice: Float!): Car!
  scheduleCarMaintenance(id: ID!): Car!

  # ── Brand CRUD Operations ──────────────────────────────────
  createBrand(name: String!): Brand!
  updateBrand(id: ID!, name: String!): Brand!
  deleteBrand(id: ID!): Boolean!

  # ── Model CRUD Operations ──────────────────────────────────
  createModel(name: String!, brandId: ID!): VehicleModel!
  updateModel(id: ID!, name: String, brandId: ID): VehicleModel!
  deleteModel(id: ID!): Boolean!

  # ── FuelType CRUD Operations ───────────────────────────────
  createFuelType(name: String!): FuelType!
  updateFuelType(id: ID!, name: String!): FuelType!
  deleteFuelType(id: ID!): Boolean!
}