enum PaymentStatus {
  PENDING
  PAID
  FAILED
  PARTIALLY_REFUNDED
  REFUNDED
}

type PaymentMethod {
  id:   ID!
  name: String!
}

type Payment {
  id:            ID!
  bookingId:     ID!
  amount:        Float!
  refundedAmount: Float!
  refundPolicy:  String
  refundedAt:    DateTime
  status:        PaymentStatus!
  stripeId:      String
  paymentMethod: PaymentMethod
  createdAt:     DateTime!
  updatedAt:     DateTime!
}

type CheckoutSession {
  url:       String!
  sessionId: String!
}

type RefundPreview {
  policy:           String!
  refundAmount:     Float!
  keepAmount:       Float!
  hoursUntilPickup: Float!
}

type PaginatedPayments {
  items:    [Payment!]!
  pageInfo: PageInfo!
}

extend type Query {
  payment(id: ID!):                        Payment
  paymentByBooking(bookingId: ID!):        Payment
  refundPreview(bookingId: ID!):           RefundPreview
  myPayments(pagination: PaginationInput): PaginatedPayments!
  payments(pagination: PaginationInput):   PaginatedPayments!
  paymentMethods: [PaymentMethod!]!
}

extend type Mutation {
  createCheckoutSession(bookingId: ID!): CheckoutSession!
  adminRecordBookingPayment(bookingId: ID!, paymentMethodId: ID!, amount: Float!): Payment!
  adminRefundBookingPayment(bookingId: ID!): Payment!
  refundPayment(paymentId: ID!):         Payment!
  mockFinalizePayment(bookingId: String!, success: Boolean!): Payment!

  # ── PaymentMethod CRUD Operations ──────────────────────────
  createPaymentMethod(name: String!): PaymentMethod!
  updatePaymentMethod(id: ID!, name: String!): PaymentMethod!
  deletePaymentMethod(id: ID!): Boolean!
}
